name: Build and release Windows

on:
  workflow_dispatch:
    inputs:
      diagnostic:
        description: "Build dedicated diagnostic installer with Windows LocalDumps"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: "0"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Python 3.11 produces a frozen executable that is compatible with
          # a wider range of deployed Windows systems.
          python-version: "3.11"

      - name: Install dependencies and Chromium
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m playwright install chromium

      - name: Smoke-test source imports
        shell: pwsh
        run: |
          python -m unittest -v test_recovery
          python app.py --self-test

      - name: Build ATS-TXL onedir application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --collect-all playwright --collect-all keyring --name ATS-TXL app.py
          if (!(Test-Path "dist/ATS-TXL/ATS-TXL.exe")) { throw "PyInstaller did not create the onedir ATS-TXL.exe" }

      - name: Smoke-test frozen onedir application
        shell: pwsh
        run: |
          & ".\\dist\\ATS-TXL\\ATS-TXL.exe" --self-test
          $windowedExit = $LASTEXITCODE
          # A Windows GUI-subsystem application does not always populate
          # $LASTEXITCODE in PowerShell. Treat only an explicit non-zero
          # value as a failed startup.
          if (($null -ne $windowedExit) -and ($windowedExit -ne 0)) {
            Write-Host "Windowed EXE failed; building a console diagnostic copy..."
            python -m PyInstaller --noconfirm --clean --onedir --console --collect-all playwright --collect-all keyring --name ATS-TXL-diagnostic app.py
            & ".\\dist\\ATS-TXL-diagnostic\\ATS-TXL-diagnostic.exe" --self-test
            throw "Frozen onedir ATS-TXL.exe could not start (windowed exit code: $windowedExit)"
          }

      - name: Install Inno Setup and create installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress --yes
          $version = (python -c "from version import APP_VERSION; print(APP_VERSION)").Trim()
          $args = @("/DMyAppVersion=$version")
          if ("${{ inputs.diagnostic }}" -eq "true") { $args += "/DDiagnosticBuild" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" @args "installer\ATS-TXL.iss"
          if (!(Test-Path "dist/ATS-TXL-Setup.exe")) { throw "Inno Setup did not create ATS-TXL-Setup.exe" }

      - name: Create installer SHA-256 and read version
        id: version
        shell: pwsh
        run: |
          $version = (python -c "from version import APP_VERSION; print(APP_VERSION)").Trim()
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath "dist/ATS-TXL-Setup.exe").Hash.ToLower()
          Set-Content -LiteralPath "dist/ATS-TXL-Setup.exe.sha256" -Value "$hash  ATS-TXL-Setup.exe" -Encoding ascii
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Save build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ATS-TXL-${{ steps.version.outputs.version }}-windows
          path: |
            dist/ATS-TXL-Setup.exe
            dist/ATS-TXL-Setup.exe.sha256
          if-no-files-found: error

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $tag = "v$env:VERSION"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag "dist/ATS-TXL-Setup.exe#ATS-TXL-Setup.exe" "dist/ATS-TXL-Setup.exe.sha256#ATS-TXL-Setup.exe.sha256" --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            $releaseArgs = @($tag, "dist/ATS-TXL-Setup.exe#ATS-TXL-Setup.exe", "dist/ATS-TXL-Setup.exe.sha256#ATS-TXL-Setup.exe.sha256", "--repo", $env:GITHUB_REPOSITORY, "--title", "ATS TXL v$env:VERSION", "--notes-file", "RELEASE_NOTES.md")
            if ("${{ inputs.diagnostic }}" -eq "true") { $releaseArgs += "--prerelease" } else { $releaseArgs += "--latest" }
            gh release create @releaseArgs
          }
