name: Build and release Windows

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: "0"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Python 3.11 produces a frozen executable that is compatible with
          # a wider range of deployed Windows systems.
          python-version: "3.11"

      - name: Install dependencies and Chromium
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m playwright install chromium

      - name: Smoke-test source imports
        shell: pwsh
        run: python app.py --self-test

      - name: Build ATS-TXL.exe
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --collect-all playwright --name ATS-TXL app.py
          if (!(Test-Path "dist/ATS-TXL.exe")) { throw "PyInstaller did not create ATS-TXL.exe" }

      - name: Smoke-test frozen EXE
        shell: pwsh
        run: |
          & ".\\dist\\ATS-TXL.exe" --self-test
          $windowedExit = $LASTEXITCODE
          if ($windowedExit -ne 0) {
            Write-Host "Windowed EXE failed; building a console diagnostic copy..."
            python -m PyInstaller --noconfirm --clean --onefile --console --collect-all playwright --name ATS-TXL-diagnostic app.py
            & ".\\dist\\ATS-TXL-diagnostic.exe" --self-test
            throw "Frozen ATS-TXL.exe could not start (windowed exit code: $windowedExit)"
          }

      - name: Create SHA-256 and read version
        id: version
        shell: pwsh
        run: |
          $version = (python -c "from version import APP_VERSION; print(APP_VERSION)").Trim()
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath "dist/ATS-TXL.exe").Hash.ToLower()
          Set-Content -LiteralPath "dist/ATS-TXL.exe.sha256" -Value "$hash  ATS-TXL.exe" -Encoding ascii
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Save build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ATS-TXL-${{ steps.version.outputs.version }}-windows
          path: |
            dist/ATS-TXL.exe
            dist/ATS-TXL.exe.sha256
          if-no-files-found: error

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $tag = "v$env:VERSION"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag "dist/ATS-TXL.exe#ATS-TXL.exe" "dist/ATS-TXL.exe.sha256#ATS-TXL.exe.sha256" --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag "dist/ATS-TXL.exe#ATS-TXL.exe" "dist/ATS-TXL.exe.sha256#ATS-TXL.exe.sha256" --repo $env:GITHUB_REPOSITORY --title "ATS TXL v$env:VERSION" --notes-file RELEASE_NOTES.md --latest
          }
